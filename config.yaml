# Garen Matchup Knowledge Base — project config.
# Adding another champion later = change `champion` (and its OTP sources), not code.

champion: Garen
ui_theme: demacia   # frontend theme file (frontend/src/theme/themes/<name>.css); derives from the main champion
# Build/rune (volatile) claims sourced before the newest of these patches are invalid.
# From scripts/detect_item_overhauls.py; 16.1 (season start) confirmed by user 2026-10-06.
# Kit (stable) tips have no date cutoff (user, 2026-10-07): the kit-change rules decide. Sources from before the
# durability update (13.10) describe different trades and kill thresholds, so they count for less and show as older.
older_source_before: "2023-05-17"   # patch 13.10 release
older_source_weight: 0.75
item_overhaul_patches: ["14.1", "15.1", "16.1"]
roles: [top, mid]
target_elo: platinum-diamond
language: en

http:
  min_delay_s: 2          # global minimum gap between any two network requests
  timeout_s: 30
  user_agent: "garen-assistant/0.1 (personal research tool; low volume, cached)"

# Claim weights by source_type (see CLAUDE.md "Sources").
source_weights:
  otp_guide: 1.0
  otp_video: 1.0
  onetricks_data: 0.9
  stats: 0.7
  reddit_garenmains: 0.5
  reddit_other: 0.3
  other_guide: 0.3

sources:
  data_dragon:
    versions: https://ddragon.leagueoflegends.com/api/versions.json
    champions: https://ddragon.leagueoflegends.com/cdn/{patch}/data/en_US/champion.json
    items: https://ddragon.leagueoflegends.com/cdn/{patch}/data/en_US/item.json
    runes: https://ddragon.leagueoflegends.com/cdn/{patch}/data/en_US/runesReforged.json
  lol_wiki:
    api: https://wiki.leagueoflegends.com/en-us/api.php
    patch_history_page: "{champion}/Patch_history"
  onetricks:
    matchup: https://www.onetricks.gg/champions/builds/{champion}?matchup={enemy}&role={role}
    ranking: https://www.onetricks.gg/champions/ranking/{champion}
    streamers: https://www.onetricks.gg/champions/streamers/{champion}
  otp_creators:
    - name: AddictedToBacon
      youtube_handle: "@addictedtobaconlol"
      twitch: addictedtobacon
      mobafire_guide: https://www.mobafire.com/league-of-legends/build/addictedtobacon-challenger-garen-guide-16-2-648507
